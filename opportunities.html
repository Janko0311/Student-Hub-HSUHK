<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSUHK Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <h1 class="logo">HSUHK Student Hub</h1>

                <nav>
                    <a href="HSUStudentHub.html" class="nav-item">🏠 Home</a>
                    <a href="opportunities.html" class="nav-item active">📚 Exchange/Internship</a>
                    <a href="flagship.html" class="nav-item">⭐ Flagship Program</a>
                </nav>
            </div>

            <!-- Apple Style Account Section -->
            <div class="account-section">
                <input type="checkbox" id="account-toggle" class="account-toggle">

                <label for="account-toggle" class="account-button">
                    <span>Design By Janko with ❤️</span>
                    <span class="arrow">⌄</span>
                </label>

                <div class="account-dropdown">
                    <div class="account-item">Design By Janko</div>
                    <div class="account-item">@HA6</div>
                    <div class="account-item logout"><a href="#" style="color: inherit; text-decoration: none;">Follow My GitHub For More</a></div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <h1 class="page-title">Your classroom. Without borders.</h1>

            <!-- 卡片网格容器 -->
            <div class="courses-container">

                <!-- 卡片 1: Exchange -->
                <article class="card course-card">
                    <a href="https://gao.hsu.edu.hk/en/outbound-exchange/" target="_blank" class="course-link">
                        <div class="course-img">
                            <img src="https://www.cathaypacific.com/content/dam/focal-point/digital-library/cathay-pacific/aircraft/777-300er/aircraft-777-c065.renditionimage.900.350.jpg" alt="exchange">
                        </div>
                        <h2>Exchange</h2>
                        <h3>Explore The World</h3>
                    </a>
                </article>

                
                <article class="card course-card">
                    <a href="https://aiesec.hk/global-talent/" class="course-link">
                        <div class="course-img">
                            <img src="https://www.lot.com/content/dam/lot/lot-com/other-images/summer-internship-2026/internship-2026.coreimg.jpg/1773054959592/internship-2026.jpg" alt="Internship">
                        </div>
                        <h2>Global Internship</h2>
                        <h3>Gain International Work Experience</h3>
                    </a>
                </article>

                
                <article class="card course-card">
                    <a href="https://jiness.hk/a/login?a=hsuhk" class="course-link">
                        <div class="course-img">
                            <img src="https://group.mercedes-benz.com/bilder/karriere/studenten/situative-bildwelt/praktikum-w1680xh945-cutout.jpg?impolicy=acrop&im=AspectCrop=(9,4),xPosition=0,yPosition=0.5" alt="Local Internship">
                        </div>
                        <h2>Local Internship</h2>
                        <h3>Gain Local Work Experience</h3>
                    </a>
                </article>

               

            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
